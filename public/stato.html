<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrazioni dei kit</title>
<!-- version: 2.12.1 (10/11/2026) - i canali che non hanno mai registrato (niente oggi e niente dal 27/10) non si mostrano (Dario:
     «se ci sono solo 3 canali su 8 non far vedere gli altri 5»).
     2.12.0 - fumetti con piu' informazioni (Dario: «quando ci vai sopra ti da' piu' info»): su ogni punto
     giorno, percentuale e ore registrate; su «Adesso» l'ultimo controllo, il tipo di registrazione e i tratti di oggi.
     2.11.1 - media e giorni contati dal 27/10; i valori uguali di fila scritti una volta.
     2.11.0 - il grafico come i Target di darioleads: linea blu scura, punti colorati, righe dello 0, 50 e
     100% con l'etichetta, il valore accanto a ogni punto.
     2.10.0 - dal 27/10; via le colonne Dal e Al; la data della foto sotto la foto; i tratti fra i punti
     del colore del punto (Dario).
     2.9.0 - un giorno che il registratore non ha detto e' «non letto» (grigio), mai 0%; gli archivi letti dai
     ponti prima del 0.4.0 sono «da rileggere» quando danno 0 in tutti i giorni e la telecamera oggi registra.
     2.8.1 - il grafico va sempre dal 20/10 a oggi (Dario).
     2.8.0 - «Scarica in Excel» fa un vero .xlsx (xlsx.js, senza librerie esterne).
     2.7.1 - grafico ad altezza fissa (le date non si ingrandiscono); rosso solo i giorni a zero, giallo
     sopra zero, verde dal 90% (Dario).
     2.7.0 - grafico a linee, con la stessa scala per tutte le righe e oggi sempre sul bordo destro (Dario).
     2.6.0 - «Scarica in Excel» per le cose che non tornano, le telecamere e i kit che non rispondono
     (Dario: «me lo fai estrarre in Excel?»): un file .csv con il punto e virgola, che Excel apre da solo.
     2.5.2 - il grafico largo quanto i suoi giorni (9 px l'uno), al massimo la colonna.
     2.5.1 - nel grafico il giorno piu' vecchio a sinistra e oggi a destra (Dario).
     2.5.0 - piu' stretta, senza scorrere di lato (Dario); il grafico si adatta alla colonna; «lo stesso
     registratore due volte in UVMS».
     2.4.1 - i giorni senza registrazioni fra il primo sul disco e oggi compaiono come 0% (prima sparivano).
     2.4.0 - accanto al grafico si dice cosa c'e' prima del primo giorno: archivio letto e disco vuoto
     prima di quella data, oppure archivio non ancora letto (Dario: «mi devi dire se hai misurato e non hai trovato nulla
     o se ancora non hai misurato»).
     2.3.1 - le telecamere che registrano a sensore non sono «ferme»: «a sensore, ultima HH:MM».
     2.3.0 - i giorni come grafico a barre (Dario: «invece che 100% 100% fai un grafico»): una barra per
     giorno alta quanto la percentuale, la piu' recente a sinistra; date piu' corte in Dal e Al.
     2.2.2 - il kit 998 (Roma, via Gramsci) e' il kit di prova di Dario: fuori dal confronto.
     2.2.1 - i canali con il nome di UVMS (CH 01 = il primo), non da 0.
     2.2.0 - raggruppata per kit (Dario: «comune e kit solo una volta, anche se dopo i canali sono tre»),
     i kit a colori alterni.
     2.1.0 - con l'ANAGRAFICA KIT: «Cose che non tornano» (kit installati senza registratore, registratori di
     kit non installati, stesso kit su due registratori, telecamere attese e telecamere che registrano, password sbagliate).
     2.0.0 - una riga per ogni telecamera che funziona (Dario: «non mi interessa quanti sono i canali
     in tutto»): la registrazione piu' vecchia e la piu' recente che ha in pancia, e la percentuale di registrato di ogni
     giorno sulle 24 ore, dall'ultimo giorno indietro. I kit che non rispondono stanno in fondo. -->

<link rel="stylesheet" href="ordinabile.css">
<style>
:root { --sfondo:#f5f6f8; --carta:#fff; --testo:#1d2330; --tenue:#667085; --bordo:#d9dde5; --blu:#2457c5; --verde:#1d7a46; --verde-chiaro:#dcf3e5; --rosso:#b42318; --rosso-chiaro:#fde4e1; --arancio:#9a5b00; --arancio-chiaro:#fff0d1; --grigio-chiaro:#eceff3; --raggio:10px; }
@media (prefers-color-scheme: dark) { :root { --sfondo:#14171d; --carta:#1d212a; --testo:#e7e9ee; --tenue:#9aa3b2; --bordo:#323846; --blu:#6f9bff; --verde:#4cc283; --verde-chiaro:#173a27; --rosso:#ff7a6e; --rosso-chiaro:#46201c; --arancio:#f2b34c; --arancio-chiaro:#3d2e12; --grigio-chiaro:#2a2f3a; } }
* { box-sizing:border-box }
html, body { height:100%; margin:0 }
body { font:15px/1.45 system-ui, sans-serif; background:var(--sfondo); color:var(--testo); display:flex; flex-direction:column; overflow:hidden }
header { flex:none; padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-bottom:1px solid var(--bordo); background:var(--carta) }
h1 { font-size:18px; margin:0 10px 0 0 }
main { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:0 12px 16px }
button { font:inherit; min-height:40px; padding:6px 14px; border-radius:var(--raggio); border:1px solid var(--bordo); background:var(--carta); color:var(--testo); cursor:pointer }
button.primo { background:var(--blu); color:#fff; border-color:var(--blu) }
button.scelto { outline:2px solid var(--blu) }
input { font:inherit; min-height:40px; padding:6px 10px; border-radius:var(--raggio); border:1px solid var(--bordo); background:var(--carta); color:var(--testo); width:min(280px,100%) }
.conti { display:flex; flex-wrap:wrap; gap:8px; padding:10px 0 }
.conto { background:var(--carta); border:1px solid var(--bordo); border-radius:var(--raggio); padding:6px 12px }
.conto b { font-size:18px }
table { border-collapse:collapse; width:100%; background:var(--carta); table-layout:fixed }
td, th { overflow-wrap:anywhere }
th, td { padding:4px 6px; border-bottom:1px solid var(--bordo); text-align:left; vertical-align:middle }
th { position:sticky; top:0; background:var(--carta); vertical-align:bottom; z-index:1 }
td.num { text-align:right; white-space:nowrap }
tr.kitA td { background:var(--carta) } tr.kitB td { background:var(--grigio-chiaro) }
tr.primaKit td { border-top:2px solid var(--bordo) }
.tenue { color:var(--tenue) } .no { color:var(--rosso); font-weight:600 } .ok { color:var(--verde); font-weight:600 } .mezzo { color:var(--arancio); font-weight:600 }
.giorni { display:flex; gap:2px; max-width:62vw; overflow-x:auto; padding-bottom:2px }
.grafico { display:block; width:100% }
.grafico svg { display:block; height:auto }
.grafico .linea { fill:none; stroke:var(--blu); stroke-width:1.6; vector-effect:non-scaling-stroke }
.grafico .area { fill:var(--blu); opacity:.12 } .grafico .riga90 { stroke:var(--bordo); stroke-dasharray:2 2; vector-effect:non-scaling-stroke }
.grafico .pnull { fill:var(--bordo) } .grafico .p100 { fill:var(--verde) } .grafico .p50 { fill:#e0a800 } .grafico .p0 { fill:var(--rosso) }
.grafico .tratto { stroke:#1f4e79; stroke-width:2.2; stroke-linecap:round }
.grafico .rif { stroke:var(--bordo); stroke-width:1 } .grafico .rif0 { stroke:var(--tenue); stroke-width:1 }
.grafico .val { font-size:9px; fill:var(--testo) }
@media (prefers-color-scheme: dark) { .grafico .tratto { stroke:#8fb4e0 } }
.prima { font-size:11px; color:var(--tenue); white-space:normal; margin-top:2px }
.grafico text { font-size:9px; fill:var(--tenue) }
.g { flex:none; width:34px; text-align:center; font-size:11px; line-height:1.15; border-radius:4px; padding:2px 0 }
.g b { display:block; font-size:12px }
.g100 { background:var(--verde-chiaro); color:var(--verde) } .g50 { background:var(--arancio-chiaro); color:var(--arancio) }
.g0 { background:var(--rosso-chiaro); color:var(--rosso) }
img.mini { width:100%; max-width:110px; border-radius:6px; cursor:zoom-in; display:block }
h2 { font-size:16px; margin:18px 0 6px }
#grande { position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; z-index:9 }
#grande[hidden] { display:none }
#grande img { max-width:95vw; max-height:90vh; cursor:zoom-out }
</style>
</head>
<body>
<header>
  <h1>Registrazioni dei kit</h1>
  <span id="chi" class="tenue"></span>
  <button id="entra" class="primo" hidden title="Entra col tuo account Google di Alma">Entra con Alma</button>
  <input id="cerca" placeholder="Cerca kit, via o comune" title="Filtra per numero, via, comune o cliente">
  <button data-filtro="tutti" class="scelto" title="Tutte le telecamere che funzionano">Tutte</button>
  <button data-filtro="problemi" title="Telecamere ferme adesso o con giorni sotto il 90%">Solo problemi</button>
  <button id="giro" title="Mette in coda tutti i registratori: il PC dell'ufficio li controlla uno alla volta">Ricontrolla tutti</button>
  <button id="prova" title="La pagina delle prove a mano e di RMS">Prove singole</button>
</header>
<main>
  <div class="conti" id="conti"></div>
  <h2><span id="titolo-nonTorna"></span> <button data-scarica="nonTorna" title="Scarica queste righe in un file Excel (.xlsx)">Scarica in Excel</button></h2>
  <table id="nonTorna"><colgroup><col style="width:22%"><col style="width:6%"><col style="width:36%"><col style="width:36%"></colgroup><thead><tr><th data-chiave="tipo">Cosa non torna</th><th data-chiave="kit">Kit</th><th data-chiave="dove">Dove</th><th data-ordina="no">Dettaglio</th></tr></thead><tbody></tbody></table>
  <h2>Telecamere che funzionano <button data-scarica="telecamere" title="Scarica tutte le telecamere con le percentuali dei giorni">Scarica in Excel</button></h2>
  <table id="tab">
    <colgroup><col style="width:11%"><col style="width:13%"><col style="width:5%"><col style="width:10%"><col style="width:5%"><col style="width:5%"><col style="width:41%"><col style="width:10%"></colgroup>
    <thead><tr>
      <th data-chiave="gruppo">Comune o cliente</th><th data-chiave="nome">Kit</th><th data-chiave="canale">Canale</th>
      <th data-chiave="adessoOrd" title="Dall'ultimo controllo del giro: registra adesso, ferma da un'ora, o niente oggi">Adesso</th>
      <th data-chiave="nGiorni" data-verso="giu" title="Giorni dal 27/10 di cui il registratore ha detto quanto ha registrato">Giorni</th>
      <th data-chiave="media" title="Media della percentuale di registrato dal 27/10 a ieri (24 ore = 100%)">Media</th>
      <th data-ordina="no" title="La percentuale delle 24 ore registrata giorno per giorno: oggi sul bordo destro, la stessa scala per tutte le righe. La linea tratteggiata è il 90%. Punti verdi dal 90%, gialli sopra zero, rossi a zero, grigi non letti. Passa sopra un punto per vedere giorno e percentuale">Giorni, fino a oggi</th>
      <th data-ordina="no">Foto</th>
    </tr></thead>
    <tbody></tbody>
  </table>
  <h2><span id="titolo-fermi"></span> <button data-scarica="fermi" title="Scarica i kit che non rispondono">Scarica in Excel</button></h2>
  <table id="fermi"><tbody></tbody></table>
</main>
<div id="grande" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
let righe = [], kitFermi = [], nonTorna = [], dati = {}, filtro = "tutti", ordine = { chiave: "gruppo", verso: 1 }, ordNT = { chiave: "tipo", verso: 1 };
const norm = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const hm = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const giornoIt = (iso) => { const [, m, g] = iso.split("-"); return `${g}/${m}`; };
const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const oreMin = (m) => `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`;
const breve = (t) => { const m = String(t || "").match(/^\d{4}-(\d\d)-(\d\d) (\d\d:\d\d)/); return m ? `${m[2]}/${m[1]} ${m[3]}` : (t || ""); };
/** Quando e' stata fatta la foto: il giorno della prova e l'ora del pezzo di video («dalle»). */
function quandoFoto(f) {
  const g = f.il ? new Date(f.il).toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" }) : "";
  const ora = /^\d\d:\d\d$/.test(f.dalle || "") ? f.dalle : (f.il ? new Date(f.il).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) : "");
  return `foto del ${g} ${ora}`.trim();
}
/** Cosa c'e' prima del primo giorno del grafico: misurato e vuoto, oppure non ancora misurato. */
function notaPrima(r) {
  const quando = r.letto ? new Date(r.letto).toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  if (!r.arcLetto) return "Prima di oggi: archivio non ancora letto (lo legge il giro del PC).";
  if (r.daRileggere) return `Archivio da rileggere: il ${quando} il collegamento è caduto durante la lettura (i giorni grigi non sono stati letti, non sono vuoti).`;
  if (r.arcVuoto) return `Archivio letto il ${quando}: sul disco non c'è niente di questo canale.`;
  if (r.troncato) return `Archivio letto il ${quando}: qui gli ultimi 90 giorni; il disco ha registrazioni dal ${breve(r.primo)}.`;
  return `Archivio letto il ${quando}: prima del ${breve(r.primo)} il disco non ha niente (registrazioni già sovrascritte, o il kit non registrava).`;
}
/** Il grafico dei giorni: una barra per giorno (la piu' recente a sinistra), alta quanto la percentuale delle 24 ore. */
const DAL = "2026-10-27";   // il grafico parte sempre da qui (Dario, 10/11: «fammi sempre vedere dal 20/10 in poi»)
let GIORNI_SCALA = 30;   // giorni dal 20/10 a oggi
/** La linea dei giorni, come i Target di darioleads: altezza fissa, larga quanto la colonna, oggi sul bordo destro. */
function grafico(perc) {
  if (!perc.length) return '<span class="tenue">-</span>';
  const H = 54, top = 12, basso = H - 4, N = GIORNI_SCALA, sx = 7;   // sx: margine a sinistra (in %) per le etichette 0/50/100
  const oggi = new Date(perc[0][0] + "T12:00:00");
  const xg = (g) => 98 - (98 - sx - 1) * Math.round((oggi - new Date(g + "T12:00:00")) / 864e5) / Math.max(1, N - 1);
  const yp = (p) => top + (basso - top) * (1 - p / 100);
  const punti = [...perc].reverse().filter(([g]) => g >= DAL).map(([g, p, m, su]) => [xg(g), p == null ? basso : yp(p), g, p, m, su]);
  const rif = [0, 50, 100].map((v) => `<line class="${v ? "rif" : "rif0"}" x1="${sx}%" x2="99%" y1="${yp(v)}" y2="${yp(v)}"/><text x="${sx - 0.6}%" y="${yp(v) + 3}" text-anchor="end">${v}%</text>`).join("");
  const tratti = punti.slice(1).filter((pt, i) => pt[3] != null && punti[i][3] != null)
    .map((pt) => { const i = punti.indexOf(pt) - 1; return `<line class="tratto" x1="${punti[i][0].toFixed(2)}%" y1="${punti[i][1].toFixed(1)}" x2="${pt[0].toFixed(2)}%" y2="${pt[1].toFixed(1)}"/>`; }).join("");
  const fumetto = (g, p, m, su) => p == null ? `${giornoIt(g)}: non letto (il registratore non ha risposto)`
    : `${giornoIt(g)}${su < 1440 ? " (fino alle " + hm(su) + ")" : ""}: ${p}%, ${oreMin(m)} registrati su ${su < 1440 ? oreMin(su) : "24 h"}`;
  const pallini = punti.map(([x, y, g, p, m, su]) => `<circle class="${p == null ? "pnull" : p >= 90 ? "p100" : p > 0 ? "p50" : "p0"}" cx="${x.toFixed(2)}%" cy="${y.toFixed(1)}" r="3"/>` +
    `<circle cx="${x.toFixed(2)}%" cy="${y.toFixed(1)}" r="9" fill="transparent" data-spiega="${esc(fumetto(g, p, m, su))}"></circle>`).join("");
  // il valore accanto al punto: sopra, o sotto se il punto e' in alto; i 100% di fila non si ripetono
  const valori = punti.map(([x, y, , p], i) => {
    if (p == null || (i > 0 && punti[i - 1][3] === p && i < punti.length - 1)) return "";
    return `<text class="val" x="${x.toFixed(2)}%" y="${(p > 80 ? y - 5 : y - 5).toFixed(1)}" text-anchor="middle">${p}%</text>`;
  }).join("");
  const etichette = [];
  for (let i = 0; i < N; i += 7) {
    if (N - 1 - i < 3 && i) continue;
    const d = new Date(oggi - i * 864e5).toISOString().slice(0, 10);
    const x = 98 - (98 - sx - 1) * i / Math.max(1, N - 1);
    etichette.push(`<text x="${x.toFixed(2)}%" y="${H + 10}" text-anchor="${i === 0 ? "end" : "middle"}">${i === 0 ? "oggi" : giornoIt(d)}</text>`);
  }
  etichette.push(`<text x="${sx + 1}%" y="${H + 10}" text-anchor="start">${giornoIt(DAL)}</text>`);
  return `<span class="grafico"><svg width="100%" height="${H + 12}" role="img" aria-label="registrato per giorno">${rif}${tratti}${pallini}${valori}${etichette.join("")}</svg></span>`;
}
// «09:50-10:02 continua, 10:06-13:14 continua» -> [[inizio, fine], ...] in minuti
const tratti = (t) => [...String(t || "").matchAll(/(\d\d):(\d\d)-(\d\d):(\d\d)/g)].map((x) => [+x[1] * 60 + +x[2], +x[3] * 60 + +x[4]]);

/** Le righe: una per ogni canale che ha registrato qualcosa (oggi nel giro, o nell'archivio). */
function costruisci(d) {
  const cm = {}, am = {};
  for (const c of d.camere || []) (cm[c.uid] = cm[c.uid] || {})[c.canale] = c;
  for (const a of d.archivio || []) (am[a.uid] = am[a.uid] || {})[a.canale] = a;
  righe = []; kitFermi = [];
  for (const k of d.kit) {
    const e = k.esito || {};
    if (k.stato === "fallito") { kitFermi.push({ ...k, perche: "non risponde: " + (e.collegamento || e.errore || "?") }); continue; }
    if (!k.stato) continue;
    const t = new Date(k.finito_il), minOra = t.getHours() * 60 + t.getMinutes();
    const oggiIso = new Date(t.getTime() - t.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    const canali = new Map();
    for (const c of e.canali || []) canali.set(c.numero, { giro: c });
    for (const [n, a] of Object.entries(am[k.uid] || {})) { const x = canali.get(+n) || {}; x.arc = a; canali.set(+n, x); }
    let funzionanti = 0;
    for (const [n, x] of canali) {
      const tr = tratti(x.giro && x.giro.registrato_oggi);
      const giorni = { ...((x.arc && !Array.isArray(x.arc.giorni) && x.arc.giorni) || {}) };
      if (tr.length) giorni[oggiIso] = tr.reduce((s, [a, b]) => s + (b - a), 0);
      // l'archivio elenca solo i giorni con registrazioni: dal primo sul disco a oggi (al massimo 90) gli altri valgono 0
      if (x.arc && x.arc.primo) {
        const inizio = x.arc.primo.slice(0, 10), oggiD = new Date(oggiIso + "T12:00:00");
        for (let i = 0; i < 90; i++) {
          const g = new Date(oggiD - i * 864e5).toISOString().slice(0, 10);
          if (g < inizio) break;
          if (!(g in giorni)) giorni[g] = 0;
        }
      }
      // un archivio dei ponti vecchi con 0 in tutti i giorni passati mentre oggi registra: il collegamento era caduto
      const passatiArc = Object.entries(giorni).filter(([g]) => g !== oggiIso);
      const daRileggere = tr.length && passatiArc.length > 0 && passatiArc.every(([, m]) => !m);
      if (daRileggere) for (const [g] of passatiArc) giorni[g] = null;
      const elenco = Object.entries(giorni).sort((a, b) => (a[0] < b[0] ? 1 : -1));
      // un canale si mostra solo se ha registrato qualcosa: oggi, nelle ultime 24 ore o in un giorno dal 27/10. Un canale
      // con l'archivio tutto a zero (o senza archivio) e niente oggi e' un canale senza telecamera: non si mostra
      const giorniVeri = Object.entries(giorni).some(([g, m]) => g >= DAL && m > 0);
      const haRegistrato = tr.length || (x.giro && x.giro.minuti_24h > 0) || giorniVeri ||
        (x.arc && x.arc.primo && Object.values(giorni).some((m) => m == null));   // archivio letto a meta': nel dubbio si mostra
      if (!haRegistrato) continue;
      funzionanti++;
      const ultimo = tr.length ? Math.max(...tr.map((z) => z[1])) : null;
      const sensore = /sensore|moviment/.test(String(x.giro && x.giro.registrato_oggi || ""));
      const adesso = ultimo == null ? "niente oggi" : minOra - ultimo <= 15 ? "registra" : sensore ? "a sensore, ultima " + hm(ultimo) : "ferma dalle " + hm(ultimo);
      // la percentuale di un giorno: su 1440 minuti; oggi sulle ore passate fino al controllo
      const perc = elenco.map(([g, m]) => [g, m == null ? null : Math.min(100, Math.round(100 * m / (g === oggiIso ? Math.max(1, minOra) : 1440))), m, g === oggiIso ? minOra : 1440]);
      const passati = perc.filter(([g, p]) => g !== oggiIso && p != null && g >= DAL);
      righe.push({
        uid: k.uid, gruppo: k.gruppo, nome: k.nome, modello: k.modello, canale: n, adesso,
        info: [`Ultimo controllo: ${new Date(k.finito_il).toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}`,
          sensore ? "Registra a sensore (solo quando succede qualcosa)" : tr.length ? "Registrazione continua" : "",
          x.giro && x.giro.registrato_oggi ? "Oggi: " + x.giro.registrato_oggi : "", (x.giro && x.giro.titolo) ? "Nome nel registratore: " + x.giro.titolo : ""].filter(Boolean).join("\n"),
        adessoOrd: adesso === "registra" || adesso.startsWith("a sensore") ? 2 : adesso.startsWith("ferma") ? 1 : 0,
        primo: (x.arc && x.arc.primo) || "", ultimo: (x.arc && x.arc.ultimo) || "", letto: (x.arc && x.arc.letto_il) || "",
        arcLetto: !!x.arc, daRileggere, arcVuoto: !!(x.arc && !x.arc.primo), troncato: !!(x.arc && x.arc.giorni && Object.keys(x.arc.giorni).length >= 90),
        nGiorni: x.arc ? Object.keys(giorni).filter((g) => g >= DAL).length : null, perc,
        media: passati.length ? Math.round(passati.reduce((s, [, p]) => s + p, 0) / passati.length) : null,
        foto: (cm[k.uid] || {})[n],
      });
    }
    if (!funzionanti) kitFermi.push({ ...k, perche: "nessuna telecamera ha registrato oggi" });
    k.funzionanti = funzionanti;
  }
  confronta(d);
}
/** Le cose che non tornano fra UVMS, il giro e l'ANAGRAFICA KIT. */
function confronta(d) {
  nonTorna = [];
  const ana = new Map((d.anagrafica || []).map((a) => [a.kit, a]));
  const perKit = new Map();
  for (const k of d.kit) { const n = parseInt(k.kit, 10); if (n) (perKit.get(n) || perKit.set(n, []).get(n)).push(k); }
  const nonInst = (k) => /NON INSTALLATI/i.test(k.gruppo);
  const perUid = new Map();
  for (const k of d.kit) (perUid.get(k.uid) || perUid.set(k.uid, []).get(k.uid)).push(k);
  for (const [, ks] of perUid) if (ks.length > 1) {
    const n = ks.map((k) => parseInt(k.kit, 10)).find((x) => x) || "";
    nonTorna.push({ tipo: "Lo stesso registratore due volte in UVMS", kit: n, dove: ks.map((k) => `${k.gruppo} / ${k.nome}`).join(" · "), det: "stesso codice P2P con due nomi: tenerne uno solo" });
  }
  const DI_PROVA = new Set([998]);   // il kit di prova di Dario (Roma, via Gramsci, 10/11)
  for (const [n, a] of ana) {
    if (a.stato === "INSTALLATO" && !perKit.has(n) && !DI_PROVA.has(n))
      nonTorna.push({ tipo: "Installato ma non è in UVMS", kit: n, dove: `${a.cloud} · ${a.indirizzo}`, det: "senza il registratore in UVMS non si guarda e il giro non lo controlla" });
  }
  for (const [n, ks] of perKit) {
    const a = ana.get(n);
    const vivi = ks.filter((k) => !nonInst(k));
    if (new Set(vivi.map((k) => k.uid)).size > 1) nonTorna.push({ tipo: "Stesso kit su più registratori", kit: n, dove: vivi.map((k) => `${k.gruppo} / ${k.nome}`).join(" · "), det: "di solito è il registratore vecchio rimasto dopo una sostituzione" });
    for (const k of vivi) {
      if (a && a.stato !== "INSTALLATO") nonTorna.push({ tipo: "In UVMS fra gli installati, l'anagrafica no", kit: n, dove: `${k.gruppo} / ${k.nome}`, det: `anagrafica: ${a.stato || "senza stato"}` });
      if (!a) nonTorna.push({ tipo: "In UVMS ma non nell'anagrafica", kit: n, dove: `${k.gruppo} / ${k.nome}`, det: "" });
      const e = k.esito || {};
      if (k.stato === "fallito" && /password/i.test(e.collegamento || "")) nonTorna.push({ tipo: "Password del registratore diversa", kit: n, dove: `${k.gruppo} / ${k.nome}`, det: "la password comune non entra: va scritta quella giusta" });
      if (a && a.stato === "INSTALLATO" && k.stato === "fatto" && a.telecamere && k.funzionanti < a.telecamere)
        nonTorna.push({ tipo: "Meno telecamere di quelle attese", kit: n, dove: `${k.gruppo} / ${k.nome}`, det: `l'anagrafica ne dice ${a.telecamere}, oggi ne registrano ${k.funzionanti}` });
      if (a && a.stato === "INSTALLATO" && k.stato === "fatto" && a.telecamere && k.funzionanti > a.telecamere)
        nonTorna.push({ tipo: "Più telecamere di quelle attese", kit: n, dove: `${k.gruppo} / ${k.nome}`, det: `l'anagrafica ne dice ${a.telecamere}, oggi ne registrano ${k.funzionanti}` });
    }
  }
}
function disegna() {
  const parole = norm($("#cerca").value).split(/\s+/).filter(Boolean);
  const ok = (r) => parole.every((p) => norm(r.gruppo + " " + r.nome + " " + r.modello).includes(p));
  const problema = (r) => r.adessoOrd < 2 || (r.media != null && r.media < 90) || r.perc.slice(1, 8).some(([, p]) => p < 90);
  // i canali di un kit stanno insieme: si ordina per kit (per una colonna dei canali vale il canale peggiore del kit)
  const gruppi = new Map();
  for (const r of righe) if (ok(r) && (filtro === "tutti" || problema(r))) (gruppi.get(r.uid) || gruppi.set(r.uid, []).get(r.uid)).push(r);
  const chiaveKit = (rs) => {
    const c = ordine.chiave;
    if (c === "gruppo" || c === "nome") return rs[0][c];
    const v = rs.map((r) => r[c]).filter((x) => x != null && x !== "");
    if (!v.length) return null;
    return ordine.verso > 0 ? v.reduce((a, b) => (b < a ? b : a)) : v.reduce((a, b) => (b > a ? b : a));
  };
  const kitOrdinati = [...gruppi.values()].map((rs) => ({ rs: rs.sort((a, b) => a.canale - b.canale), k: chiaveKit(rs) }))
    .sort((a, b) => {
      if (a.k == null && b.k != null) return 1;
      if (b.k == null && a.k != null) return -1;
      const d = (a.k > b.k ? 1 : a.k < b.k ? -1 : 0) * ordine.verso;
      return d || (a.rs[0].gruppo + a.rs[0].nome > b.rs[0].gruppo + b.rs[0].nome ? 1 : -1);
    });
  const kitOk = new Set(righe.map((r) => r.uid));
  $("#conti").innerHTML = [
    ["Telecamere che funzionano", righe.length], ["Registrano adesso", righe.filter((r) => r.adessoOrd === 2).length],
    ["Ferme o niente oggi", righe.filter((r) => r.adessoOrd < 2).length], ["Kit con telecamere che funzionano", kitOk.size],
    ["Kit che non rispondono o senza registrazioni", kitFermi.length], ["Registratori in coda al PC", dati.coda || 0],
  ].map(([t, n]) => `<div class="conto">${t}<br><b>${n}</b></div>`).join("");
  $("#tab tbody").innerHTML = kitOrdinati.map(({ rs }, ik) => rs.map((r, ic) => `<tr class="${ik % 2 ? "kitB" : "kitA"}${ic === 0 ? " primaKit" : ""}">
    ${ic === 0 ? `<td rowspan="${rs.length}">${r.gruppo}</td><td rowspan="${rs.length}">${r.nome}<div class="tenue">${r.modello || ""}</div></td>` : ""}
    <td class="num" title="Il canale come in UVMS">CH ${String(r.canale + 1).padStart(2, "0")}</td>
    <td class="${r.adessoOrd === 2 ? "ok" : r.adessoOrd === 1 ? "mezzo" : "no"}" title="${esc(r.info)}">${r.adesso}</td>
    <td class="num">${r.nGiorni ?? "-"}</td>
    <td class="num ${r.media == null ? "tenue" : r.media >= 90 ? "ok" : r.media >= 30 ? "mezzo" : "no"}">${r.media == null ? "-" : r.media + "%"}</td>
    <td>${grafico(r.perc)}<div class="prima">${notaPrima(r)}</div></td>
    <td>${r.foto && r.foto.ha_foto ? `<img class="mini" loading="lazy" src="/api/p2p?op=fotocam&uid=${r.uid}&canale=${r.canale}&v=${encodeURIComponent(r.foto.il)}" alt="CH ${String(r.canale + 1).padStart(2, "0")}" title="${r.foto.vista}"><div class="tenue" style="font-size:11px">${quandoFoto(r.foto)}</div>` : r.foto ? `<span class="${r.foto.vista === "si vede" ? "ok" : "no"}">${r.foto.vista}</span><div class="tenue" style="font-size:11px">${quandoFoto(r.foto)}</div>` : ""}</td>
  </tr>`).join("")).join("");
  const nt = nonTorna.filter((x) => !parole.length || parole.every((p) => norm(x.kit + " " + x.dove + " " + x.tipo).includes(p)))
    .sort((a, b) => { const x = a[ordNT.chiave] ?? "", y = b[ordNT.chiave] ?? ""; return (x > y ? 1 : x < y ? -1 : 0) * ordNT.verso; });
  const quando = (dati.anagrafica || [])[0] ? new Date(dati.anagrafica[0].aggiornata_il).toLocaleString("it-IT") : "";
  $("#titolo-nonTorna").textContent = `Cose che non tornano (${nt.length})` + (quando ? ` · anagrafica letta il ${quando}` : " · anagrafica non ancora caricata");
  $("#nonTorna tbody").innerHTML = nt.map((x) => `<tr><td class="no">${x.tipo}</td><td class="num">${x.kit}</td><td>${x.dove}</td><td class="tenue">${x.det}</td></tr>`).join("");
  const f = kitFermi.filter(ok);
  $("#titolo-fermi").textContent = f.length ? `Kit che non rispondono o senza registrazioni oggi (${f.length})` : "";
  $("#fermi tbody").innerHTML = f.map((k) => `<tr><td>${k.gruppo}</td><td>${k.nome}</td><td class="no">${k.perche}</td><td class="tenue">${k.finito_il ? new Date(k.finito_il).toLocaleString("it-IT") : ""}</td></tr>`).join("");
}
async function carica() {
  const r = await fetch("/api/p2p?op=stato");
  const d = await r.json().catch(() => ({}));
  if (d.entra || r.status === 401) { $("#entra").hidden = false; $("#chi").textContent = "entra con Alma per vedere i kit"; return; }
  if (!d.kit) return;
  dati = d; costruisci(d);
  GIORNI_SCALA = Math.max(2, Math.round((new Date() - new Date(DAL + "T00:00:00")) / 864e5) + 1);
  disegna();
}
tabellaOrdinabile($("#nonTorna"), { alCambio: (chiave, verso) => { ordNT = { chiave, verso }; disegna(); } });
tabellaOrdinabile($("#tab"), { alCambio: (chiave, verso) => { ordine = { chiave, verso }; disegna(); } });
$("#cerca").addEventListener("input", disegna);
for (const b of document.querySelectorAll("button[data-filtro]")) b.addEventListener("click", () => {
  filtro = b.dataset.filtro; document.querySelectorAll("button[data-filtro]").forEach((x) => x.classList.toggle("scelto", x === b)); disegna();
});
$("#entra").addEventListener("click", () => { location.href = "/api/entra"; });
$("#prova").addEventListener("click", () => { location.href = "/"; });
$("#giro").addEventListener("click", async () => {
  const r = await fetch("/api/p2p?op=accoda", { method: "POST" });
  const d = await r.json().catch(() => ({}));
  $("#chi").textContent = d.accodati != null ? `${d.accodati} registratori messi in coda` : (d.errore || "non riuscito");
  carica();
});
/** Un vero .xlsx col nome di oggi (xlsx.js). */
function scaricaXlsx(nome, intest, righe, larghezze) {
  XLSX.scarica(`${nome} ${new Date().toLocaleDateString("it-IT").replace(/\//g, "-")}.xlsx`, [{ nome, intestazione: intest, righe, larghezze }]);
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-scarica]"); if (!b) return;
  if (b.dataset.scarica === "nonTorna")
    scaricaXlsx("Cose che non tornano", ["Cosa non torna", "Kit", "Dove", "Dettaglio", "Correzione (Barbara)", "Fatto"], nonTorna.map((x) => [x.tipo, Number(x.kit) || x.kit, x.dove, x.det, "", ""]), [38, 7, 60, 60, 40, 8]);
  if (b.dataset.scarica === "telecamere") {
    const giorni = [...new Set(righe.flatMap((r) => r.perc.map(([g]) => g)))].sort();
    scaricaXlsx("Telecamere dei kit", ["Comune o cliente", "Kit", "Canale", "Adesso", "Dal", "Al", "Giorni", "Media %", ...giorni.map(giornoIt)],
      righe.map((r) => { const m = new Map(r.perc); return [r.gruppo, r.nome, "CH " + String(r.canale + 1).padStart(2, "0"), r.adesso, r.primo, r.ultimo, r.nGiorni ?? "", r.media ?? "", ...giorni.map((g) => (m.has(g) ? m.get(g) : ""))]; }), [24, 30, 8, 22, 16, 16, 7, 8, ...giorni.map(() => 6)]);
  }
  if (b.dataset.scarica === "fermi")
    scaricaXlsx("Kit che non rispondono", ["Comune o cliente", "Kit", "Cosa risponde", "Ultimo controllo", "Nota (Barbara)", "Fatto"], kitFermi.map((k) => [k.gruppo, k.nome, k.perche, k.finito_il ? new Date(k.finito_il).toLocaleString("it-IT") : "", "", ""]), [26, 36, 50, 20, 40, 8]);
});
$("#grande").addEventListener("click", () => { $("#grande").hidden = true; });
$("#tab").addEventListener("click", (e) => { const i = e.target.closest("img.mini"); if (i) { $("#grande").innerHTML = `<img src="${i.src}">`; $("#grande").hidden = false; } });
fetch("/api/p2p?op=chi").then((r) => r.json()).then((d) => { if (d.email) $("#chi").textContent = "dentro come " + d.email; }).catch(() => {});
carica(); setInterval(carica, 60000);
